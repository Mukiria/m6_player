name: m6player
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6  # For playing .mp3 files
  file_picker: ^13.1.0  # Pick .mp3 files
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true  # ✅ Ensure this is correctly placed

  assets:
    - assets/logo.png
    - assets/splash-screen.jpg
    - assets/splash-screen-radio.jpg

  fonts:
    - family: Schyler
      fonts:
        - asset: assets/fonts/SchuylerScript.ttf
          style: italic
          weight: 700

    - family: Code
      fonts:
        - asset: assets/fonts/Code.otf
          weight: 800
