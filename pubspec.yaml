name: m6player
description: "m6 player: a local MP3 player and internet radio for Android and iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.10.6  # For playing .mp3 files
  audio_service: ^0.18.19  # Background playback, notification + lock-screen + headset controls (lib/services/audio_handler.dart)
  file_picker: ^13.1.0  # Pick .mp3 files and folders
  path_provider: ^2.1.6  # App folder for the music library
  http: ^1.6.0
  flutter_svg: ^2.3.0  # The m6 player logo (light and dark versions)
  audio_metadata_reader: ^1.8.0  # Song titles, artists and cover art from MP3 tags (pure Dart)
  photo_manager: ^3.12.0  # Lists the phone's videos (with thumbnails); also asks for the audio permission
  video_player: ^2.10.0  # Plays them
  share_plus: ^13.3.1  # Share a song or video to other apps
  nearby_connections: ^4.3.0  # Phone-to-phone file transfer (Bluetooth + Wi-Fi, Android)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true  # ✅ Ensure this is correctly placed

  assets:
    - assets/branding/
    - assets/backgrounds/
