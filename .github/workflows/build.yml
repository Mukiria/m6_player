name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: flutter build apk --release
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log || {
            # Surface the error as an annotation (visible without signing in)
            msg=$(grep -B2 -A30 -E "What went wrong|Error:|error:|FAILURE|Exception" build.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=flutter build apk failed::$msg"
            exit 1
          }

      - uses: actions/upload-artifact@v5
        with:
          name: m6player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
