name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: .github/scripts/check-lockfile.sh
      - run: .github/scripts/run.sh flutter analyze --no-fatal-infos
      - run: .github/scripts/run.sh flutter test

      # Release signing: with the ANDROID_KEYSTORE_* secrets set, the build is
      # signed with the upload key (Play-ready). Without them, build.gradle.kts
      # falls back to the debug key and the AAB can't go to the Play Store.
      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - building with the debug key (not uploadable to Play)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - run: .github/scripts/run.sh flutter build apk --release
      - run: .github/scripts/run.sh flutter build appbundle --release

      - name: List native debug symbols inside the AAB
        run: |
          unzip -l build/app/outputs/bundle/release/app-release.aab | grep -E "BUNDLE-METADATA|\.so" || echo "no symbols or .so found"

      - uses: actions/upload-artifact@v5
        with:
          name: m6player-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v5
        with:
          name: m6player-aab
          path: build/app/outputs/bundle/release/app-release.aab

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: .github/scripts/run.sh flutter build ios --release --no-codesign
